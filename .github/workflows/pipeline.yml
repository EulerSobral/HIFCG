name: CI/CD Pipeline - HIFCG (Hostinger Cloud)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:

  # 1. CI BACKEND - Testes (Unitários + Integração) e Build Spring Boot

  ci-backend:
    name: CI Backend (Java 26 & Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./demo

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 26 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '26'
          cache: 'gradle'

      - name: Conceder permissão de execução ao Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Executar testes automatizados (Unitários e Integração)
        run: ./gradlew test --no-daemon

      - name: Compilar pacote de produção (bootJar)
        run: ./gradlew bootJar -x test --no-daemon

 
  # 2. CI FRONTEND - Instalação e Build React / Vite / TanStack Start

  ci-frontend:
    name: CI Frontend (Node 22 & Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Instalar dependências
        run: npm install

      - name: Compilar build de produção do Frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || '' }}
        run: npm run build


  # 3. CD DEPLOY - Hospedagem na Nuvem Hostinger (VPS + Docker Compose)

  cd-deploy:
    name: CD Deploy na Hostinger Cloud
    needs: [ci-backend, ci-frontend]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Validar Secrets obrigatórios da Hostinger
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_PASSWORD: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ]; then
            echo "❌ Erro: As secrets HOSTINGER_SSH_HOST e HOSTINGER_SSH_USER precisam estar configuradas no repositório do GitHub."
            exit 1
          fi
          if [ -z "$SSH_KEY" ] && [ -z "$SSH_PASSWORD" ]; then
            echo "❌ Erro: Configure HOSTINGER_SSH_KEY (chave privada SSH) ou HOSTINGER_SSH_PASSWORD (senha SSH) nas secrets do GitHub."
            exit 1
          fi

      - name: Gerar arquivo .env de produção a partir dos GitHub Secrets
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          FRONTEND_PORT: ${{ secrets.FRONTEND_PORT }}
        run: |
          {
            printf 'POSTGRES_DB=%s\n' "${POSTGRES_DB:-hifcgdb}"
            printf 'POSTGRES_USER=%s\n' "${POSTGRES_USER:-hifcg}"
            printf 'POSTGRES_PASSWORD=%s\n' "${POSTGRES_PASSWORD:-hifcg123}"
            printf 'BACKEND_URL=%s\n' "${BACKEND_URL:-http://backend:8080}"
            printf 'VITE_API_URL=%s\n' "${VITE_API_URL:-}"
            printf 'FRONTEND_PORT=%s\n' "${FRONTEND_PORT:-3000}"
          } > .env
          chmod 600 .env

      - name: Empacotar projeto e secrets para transferência rápida
        run: |
          tar --exclude='./.git' \
              --exclude='./demo/.gradle' \
              --exclude='./demo/build' \
              --exclude='./frontend/node_modules' \
              --exclude='./frontend/dist' \
              --exclude='./frontend/.output' \
              --exclude='./deploy.tar.gz' \
              -czf deploy.tar.gz .env docker-compose.yml database demo frontend

      - name: Enviar pacote para o servidor da Hostinger via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          source: "deploy.tar.gz"
          target: "/tmp"

      - name: Executar Deploy via Docker Compose no servidor Hostinger
        uses: appleboy/ssh-action@v1.1.0
        env:
          DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH || '/opt/hifcg' }}
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          envs: DEPLOY_PATH
          script: |
            set -e
            echo "🚀 Preparando diretório de deploy em ${DEPLOY_PATH:-/opt/hifcg}..."
            DEPLOY_DIR="${DEPLOY_PATH:-/opt/hifcg}"
            mkdir -p "$DEPLOY_DIR"

            # Instala o Docker automaticamente caso o servidor da Hostinger ainda não o possua
            if ! command -v docker &> /dev/null; then
              echo "📦 Docker não encontrado. Instalando Docker Engine..."
              curl -fsSL https://get.docker.com | sh
              systemctl enable --now docker
            fi

            echo "📂 Extraindo arquivos atualizados e .env..."
            tar -xzf /tmp/deploy.tar.gz -C "$DEPLOY_DIR"
            rm -f /tmp/deploy.tar.gz

            cd "$DEPLOY_DIR"
            chmod 600 .env

            echo "🐳 Subindo containers com Docker Compose..."
            docker compose up -d --build --remove-orphans

            echo "🧹 Limpando imagens antigas não utilizadas..."
            docker image prune -f

            echo "✅ Status dos serviços:"
            docker compose ps
