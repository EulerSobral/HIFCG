name: CI/CD Pipeline - HIFCG (Hostinger Cloud)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # 1. CI BACKEND - Testes (Unitários + Integração) e Build Spring Boot
  ci-backend:
    name: CI Backend (Java 26 & Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./demo

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 26 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '26'
          cache: 'gradle'

      - name: Conceder permissão de execução ao Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Executar testes automatizados (Unitários e Integração)
        run: ./gradlew test --no-daemon

      - name: Compilar pacote de produção (bootJar)
        run: ./gradlew bootJar -x test --no-daemon

  # 2. CI FRONTEND - Instalação e Build React / Vite / TanStack Start

  ci-frontend:
    name: CI Frontend (Node 22 & Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Instalar dependências
        run: npm install

      - name: Compilar build de produção do Frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || '' }}
        run: npm run build

  # 3. CD DEPLOY - Hospedagem 
  cd-deploy:
    name: CD Deploy no Servidor
    needs: [ci-backend, ci-frontend]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy na VPS Hostinger via Docker Compose
        uses: hostinger/deploy-action@v1
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID || secrets.HOSTINGER_VM_ID }}
          project-name: hifcg
          personal-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          docker-compose-path: docker-compose.yml
          environment-variables: |
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            BACKEND_URL=${{ secrets.BACKEND_URL || 'http://backend:8080' }}
            VITE_API_URL=${{ secrets.VITE_API_URL || '' }}
            FRONTEND_PORT=${{ secrets.FRONTEND_PORT || '3000' }}
